<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="A simple, polished task planner with due-date reminders.">
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="./resources/images/to_do_icon.jpg">
    <title>My Tasks</title>
</head>
<body>
    <main class="app-shell">
        <section class="container" aria-labelledby="page-title">
            <header class="app-header">
                <div class="heading-group">
                    <div class="brand-mark" aria-hidden="true"><i class="bx bx-check"></i></div>
                    <div>
                        <p class="eyebrow">DAILY PLANNER</p>
                        <h1 id="page-title">My tasks</h1>
                        <p id="today-label" class="today-label"></p>
                    </div>
                </div>
                <div id="task-progress" class="task-progress" aria-label="Completion progress">
                    <div class="progress-center">
                        <strong id="progress-value">0%</strong>
                        <span>done</span>
                    </div>
                </div>
            </header>

            <form id="todo-form" class="task-form">
                <label class="field task-field" for="todo-input">
                    <span>Task</span>
                    <textarea id="todo-input" rows="1" maxlength="240" placeholder="What needs to be done?" required></textarea>
                </label>
                <label class="field date-field" for="dueDate">
                    <span>Due date &amp; time</span>
                    <input type="datetime-local" id="dueDate" required>
                </label>
                <button id="add-button" class="btn btn-primary" type="submit">
                    <i class="bx bx-plus" aria-hidden="true"></i>
                    <span id="submit-label">Add task</span>
                </button>
                <button id="cancel-edit" class="btn btn-secondary hidden" type="button">Cancel</button>
            </form>

            <div class="toolbar">
                <div class="filter-tabs" role="group" aria-label="Filter tasks">
                    <button class="filter-btn active" type="button" data-filter="all">All</button>
                    <button class="filter-btn" type="button" data-filter="pending">Pending</button>
                    <button class="filter-btn" type="button" data-filter="completed">Completed</button>
                </div>
                <div class="toolbar-meta">
                    <span><strong id="r-count">0</strong> tasks</span>
                    <button id="delete-selected" class="text-btn" type="button">Clear completed</button>
                </div>
            </div>

            <div id="empty-state" class="empty-state">
                <i class="bx bx-check-circle" aria-hidden="true"></i>
                <h2>No tasks yet</h2>
                <p>Add your first task and give your day some direction.</p>
            </div>
            <ul id="all-todos" class="todos-list" aria-live="polite"></ul>

            <footer class="app-footer">
                <div class="footer-progress">
                    <div class="progress-track"><span id="progress-bar"></span></div>
                    <p><span id="c-count">0</span> completed</p>
                </div>
                <button id="delete-all" class="text-btn danger" type="button">Delete all</button>
            </footer>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="index.js"></script>
</body>
</html>
